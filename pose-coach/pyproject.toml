[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-squat-pose-coach"
version = "0.1.0"
description = "Real-time squat counter powered by MediaPipe Pose Landmarker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "mediapipe>=0.10", "numpy>=1.24"]

[project.scripts]
squat-coach = "squat_coach.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
